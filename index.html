<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OC Transpo Final Mock Exam Quiz</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1b1f27;--muted:#5d6676;--line:#dde1e8;
  --brand:#c8102e;--brand-d:#a00d25;--ok:#1a7f4b;--okbg:#e4f5ec;--bad:#b3261e;--badbg:#fdeceb;--warn:#a85d00;--warnbg:#fff3e0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171c;--card:#1d2128;--text:#eceff4;--muted:#9aa4b5;--line:#2e3440;
  --brand:#ef4660;--brand-d:#d93350;--ok:#4cc88a;--okbg:#17352a;--bad:#ff8b84;--badbg:#3a1d1c;--warn:#ffb85c;--warnbg:#3a2b12}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--brand);color:#fff;padding:14px 16px}
header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:1.05rem;margin:0;font-weight:700}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{margin:0 0 6px;font-size:1.25rem}
h3{margin:0 0 8px;font-size:1.05rem}
p.muted,.muted{color:var(--muted)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:1rem;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sec:hover{background:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.mode{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card);text-align:left;color:var(--text);font:inherit}
.mode b{display:block}
.mode.on{border-color:var(--brand);background:var(--bg)}
.chlist{display:grid;gap:6px;margin:10px 0}
.chlist label{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.chlist label .st{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.chlist input{width:18px;height:18px;accent-color:var(--brand)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.qtext{font-size:1.1rem;font-weight:600;margin:12px 0;white-space:pre-line}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;font:inherit}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .l{font-weight:700;min-width:1.4em}
.opt.sel{border-color:var(--brand);background:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.fb{padding:10px 12px;border-radius:10px;margin:10px 0;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.score{font-size:2.6rem;font-weight:800;line-height:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.pill.hi{background:var(--badbg);color:var(--bad)}
.pill.md{background:var(--warnbg);color:var(--warn)}
.pill.lo{background:var(--okbg);color:var(--ok)}
.chrow{padding:10px 0;border-top:1px solid var(--line)}
.chrow:first-child{border-top:0}
.chrow .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
.rev .a{font-size:.92rem;margin-top:4px}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.sw{display:flex;gap:8px;align-items:center;margin:10px 0}
.sw input{width:18px;height:18px;accent-color:var(--brand)}
.hint{font-size:.8rem;color:var(--muted);margin-top:10px}
.hidden{display:none}
</style>
</head>

["In a tight turn, rear swing may be as much as:",["6 inches","1 foot","2 feet","4 feet"],"C"],
["The right mirror may extend:",["Less than one inch","More than one foot beyond the bus side","Only to the curb line","Behind the rear door only"],"B"],
["If a pole threatens the right mirror, the bus flag should be treated as:",["An exact stopping point","A guide; keep space and stop early if needed","A signal to mount the curb","A reason to skip the stop"],"B"],
["If a stop is unsafe because of an obstruction, the operator should explain, report it using MSG 9, and:",["Discharge at the closest safe location","Force customers into the obstruction","Continue indefinitely","Use MSG 4"],"A"],
["Customers must never be discharged:",["Near a driveway","Into a snowbank","At an alternate safe point","After kneeling"],"B"],
["Slowing for a service stop should be:",["Abrupt","Gradual, smooth, and one continuous motion","Delayed until the flag","Done with the spring brake"],"B"],
["A signal is required when pulling into a stop only if:",["Customers are waiting","Changing lanes","The bus is late","The curb is high"],"B"],
["At most ordinary service stops, the specialized brake that must be used is:",["Foot brake only","Interlock","Retarder only","Parking brake only"],"B"],
["Before departing, the minimum mirror scan is:",["Left only","Right-left-right again, with the full prescribed scan beginning inside","Right only","Mirrors are unnecessary"],"B"],
["A left signal to leave a bus bay should be activated:",["As soon as the doors open","Only when ready to re-enter traffic","Before customers exit","Even if the bus will remain parked"],"B"],
["Even under the yield-to-bus law, the operator must remember:",["Right of way is taken","Right of way is given, not taken","All vehicles always stop","Multiple lane changes are protected"],"B"]
]}
];
/* ============ END DATA ============ */

// Flatten with sequential question numbers
const QUESTIONS = [];
CHAPTERS.forEach((c,ci)=>{c.id=ci;c.ids=[];c.qs.forEach(q=>{
  const n=QUESTIONS.length+1;
  QUESTIONS.push({n,ch:ci,q:q[0],o:q[1],a:"ABCD".indexOf(q[2])});
  c.ids.push(n);
});});
const LET="ABCD";
const $=s=>document.querySelector(s);
const app=$("#app");

/* ============ STORAGE ============ */
const K={sess:"octq_session_v1",hist:"octq_history_v1",stats:"octq_qstats_v1"};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const del=k=>{try{localStorage.removeItem(k)}catch(e){}};

let sess=load(K.sess,null);   // in-progress quiz
let setup={mode:"full",chapters:[],count:25,shuffle:false,instant:true};

/* ============ HELPERS ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const qById=n=>QUESTIONS[n-1];
const level=p=>p<60?"hi":p<80?"md":"lo";
const levelTxt={hi:"Study first",md:"Review",lo:"Looking good"};

function recordStats(id,correct){
  const s=load(K.stats,{});
  const r=s[id]||{a:0,w:0};r.a++;if(!correct)r.w++;s[id]=r;save(K.stats,s);
}
function chapterStats(){
  const s=load(K.stats,{});
  return CHAPTERS.map(c=>{let a=0,w=0;c.ids.forEach(id=>{if(s[id]){a+=s[id].a;w+=s[id].w}});return{a,w}});
}

/* ============ HOME ============ */
function home(){
  $("#homeBtn").classList.add("hidden");
  const cs=chapterStats();
  const modeBtn=(m,t,d)=>`<button class="mode ${setup.mode===m?"on":""}" data-mode="${m}"><b>${t}</b><span class="muted">${d}</span></button>`;
  let h="";
  if(sess){
    const done=Object.keys(sess.answers).length;
    h+=`<div class="card"><h2>Quiz in progress</h2>
    <p class="muted">${esc(sess.label)}: ${done} of ${sess.ids.length} answered.</p>
    <div class="row"><button class="btn" id="resume">Resume</button><button class="btn sec" id="discard">Discard</button></div></div>`;
  }
  h+=`<div class="card"><h2>Start a quiz</h2>
  <p class="muted">${QUESTIONS.length} questions across ${CHAPTERS.length} chapters. Your progress is saved in this browser only.</p>
  <div class="modes">
    ${modeBtn("full","Entire quiz",`All ${QUESTIONS.length} questions`)}
    ${modeBtn("chapter","By chapter","Pick one or more chapters")}
    ${modeBtn("random","Random questions","A random set from all chapters")}
  </div>`;
  if(setup.mode==="chapter"){
    h+=`<div class="row" style="margin-bottom:4px"><button class="btn sec" id="allCh" style="padding:6px 12px;font-size:.85rem">Select all</button><button class="btn sec" id="noCh" style="padding:6px 12px;font-size:.85rem">Clear</button></div><div class="chlist">`;
    CHAPTERS.forEach((c,i)=>{
      const st=cs[i];const p=st.a?pct(st.a-st.w,st.a):null;
      h+=`<label><input type="checkbox" class="chk" value="${i}" ${setup.chapters.includes(i)?"checked":""}>
      <span>${i+1}. ${esc(c.name)} <span class="muted">(${c.ids.length})</span></span>
      <span class="st">${p===null?"not attempted":p+"% all-time"}</span></label>`;
    });
    h+=`</div>`;
  }
  if(setup.mode==="random"){
    h+=`<div class="row" style="margin:8px 0"><label for="cnt">Number of questions:</label>
    <select id="cnt">${[10,20,25,50,75,100].map(n=>`<option ${setup.count===n?"selected":""}>${n}</option>`).join("")}</select></div>`;
  }
  if(setup.mode!=="random"){
    h+=`<div class="sw"><input type="checkbox" id="shuf" ${setup.shuffle?"checked":""}><label for="shuf">Shuffle question order</label></div>`;
  }
  h+=`<div class="sw"><input type="checkbox" id="inst" ${setup.instant?"checked":""}><label for="inst">Show correct answer after each question</label></div>
  <button class="btn" id="start" ${setup.mode==="chapter"&&!setup.chapters.length?"disabled":""}>Start</button></div>`;

  // all-time weak spots
  const att=cs.some(c=>c.a);
  if(att){
    const rows=CHAPTERS.map((c,i)=>({c,i,st:cs[i]})).filter(r=>r.st.a).map(r=>({...r,p:pct(r.st.a-r.st.w,r.st.a)})).sort((a,b)=>a.p-b.p);
    h+=`<div class="card"><h3>Your all-time results by chapter</h3><p class="muted" style="margin-top:0">Based on every question you've answered in this browser, weakest first.</p>`;
    rows.forEach(r=>{h+=`<div class="chrow"><div class="top"><span>${r.i+1}. ${esc(r.c.name)}</span><span class="pill ${level(r.p)}">${r.p}%</span></div><div class="bar"><i style="width:${r.p}%"></i></div></div>`});
    h+=`<div class="row" style="margin-top:12px"><button class="btn sec" id="weak">Quiz me on my most-missed questions</button><button class="btn sec" id="reset">Reset all saved data</button></div></div>`;
  }
  const hist=load(K.hist,[]);
  if(hist.length){
    h+=`<div class="card"><h3>Recent attempts</h3>`;
    hist.slice(0,8).forEach(a=>{h+=`<div class="chrow"><div class="top"><span>${esc(a.label)}</span><b>${a.correct}/${a.total} (${pct(a.correct,a.total)}%)</b></div><span class="muted" style="font-size:.85rem">${new Date(a.date).toLocaleString()}</span></div>`});
    h+=`</div>`;
  }
  app.innerHTML=h;

  document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{setup.mode=b.dataset.mode;home()});
  document.querySelectorAll(".chk").forEach(c=>c.onchange=()=>{
    setup.chapters=[...document.querySelectorAll(".chk:checked")].map(x=>+x.value);
    $("#start").disabled=!setup.chapters.length;
  });
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  on("#allCh",()=>{setup.chapters=CHAPTERS.map((_,i)=>i);home()});
  on("#noCh",()=>{setup.chapters=[];home()});
  const cnt=$("#cnt");if(cnt)cnt.onchange=()=>setup.count=+cnt.value;
  const shuf=$("#shuf");if(shuf)shuf.onchange=()=>setup.shuffle=shuf.checked;
  $("#inst").onchange=e=>setup.instant=e.target.checked;
  on("#start",startQuiz);
  on("#resume",()=>quiz());
  on("#discard",()=>{if(confirm("Discard the quiz in progress?")){sess=null;del(K.sess);home()}});
  on("#weak",startWeak);
  on("#reset",()=>{if(confirm("This deletes your saved history and stats from this browser. Continue?")){del(K.hist);del(K.stats);del(K.sess);sess=null;home()}});
}

/* ============ START ============ */
function begin(ids,label){
  sess={label,ids,idx:0,answers:{},instant:setup.instant,started:Date.now()};
  save(K.sess,sess);quiz();
}
function startQuiz(){
  if(sess&&!confirm("Starting a new quiz will replace the one in progress. Continue?"))return;
  let ids,label;
  if(setup.mode==="full"){ids=QUESTIONS.map(q=>q.n);label="Entire quiz";if(setup.shuffle)ids=shuffle(ids)}
  else if(setup.mode==="chapter"){
    const chs=setup.chapters.slice().sort((a,b)=>a-b);
    ids=chs.flatMap(i=>CHAPTERS[i].ids);
    label=chs.length===1?`Chapter ${chs[0]+1}: ${CHAPTERS[chs[0]].name}`:`${chs.length} chapters`;
    if(setup.shuffle)ids=shuffle(ids);
  } else {
    ids=shuffle(QUESTIONS.map(q=>q.n)).slice(0,setup.count);label=`Random ${setup.count}`;
  }
  begin(ids,label);
}
function startWeak(){
  const s=load(K.stats,{});
  const ids=Object.keys(s).filter(k=>s[k].w>0).map(Number).sort((a,b)=>s[b].w/s[b].a-s[a].w/s[a].a||s[b].w-s[a].w).slice(0,25);
  if(!ids.length){alert("No missed questions yet.");return}
  if(sess&&!confirm("Starting a new quiz will replace the one in progress. Continue?"))return;
  begin(shuffle(ids),"Most-missed questions");
}

/* ============ QUIZ ============ */
let pending=null; // selected-but-unchecked answer when instant mode
function quiz(){
  $("#homeBtn").classList.remove("hidden");
  const id=sess.ids[sess.idx];const q=qById(id);
  const answered=sess.answers[id]!==undefined;
  const sel=answered?sess.answers[id]:pending;
  const total=sess.ids.length;
  const showFb=answered&&sess.instant;
  let h=`<div class="card">
  <div class="qmeta"><span>${esc(sess.label)}</span><span>Question ${sess.idx+1} of ${total}</span></div>
  <div class="bar"><i style="width:${Math.round(Object.keys(sess.answers).length/total*100)}%"></i></div>
  <div class="qmeta" style="margin-top:12px"><span>Ch. ${q.ch+1}: ${esc(CHAPTERS[q.ch].name)}</span><span>Q${q.n}</span></div>
  <div class="qtext">${esc(q.q)}</div>`;
  q.o.forEach((t,i)=>{
    let cls="opt";
    if(showFb){if(i===q.a)cls+=" right";else if(i===sel)cls+=" wrong"}
    else if(i===sel)cls+=" sel";
    h+=`<button class="${cls}" data-i="${i}" ${(showFb||(answered&&!sess.instant&&false))?"disabled":""}><span class="l">${LET[i]}.</span><span>${esc(t)}</span></button>`;
  });
  if(showFb){
    const ok=sel===q.a;
    h+=`<div class="fb ${ok?"ok":"no"}">${ok?"Correct!":"Incorrect. The correct answer is "+LET[q.a]+". "+esc(q.o[q.a])}</div>`;
  }
  h+=`<div class="row" style="margin-top:14px;justify-content:space-between">
    <button class="btn sec" id="prev" ${sess.idx===0?"disabled":""}>Back</button>`;
  const last=sess.idx===total-1;
  if(sess.instant&&!answered){
    h+=`<button class="btn" id="check" ${sel===null||sel===undefined?"disabled":""}>Check answer</button>`;
  } else if(last){
    h+=`<button class="btn" id="finish">Finish &amp; see results</button>`;
  } else {
    h+=`<button class="btn" id="next" ${answered?"":"disabled"}>Next</button>`;
  }
  h+=`</div><div class="hint">Tip: press A–D to choose, Enter to continue.</div></div>`;
  app.innerHTML=h;
  window.scrollTo(0,0);

  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const on=(i,f)=>{const e=$(i);if(e)e.onclick=f};
  on("#prev",()=>{sess.idx--;pending=null;save(K.sess,sess);quiz()});
  on("#next",()=>{sess.idx++;pending=null;save(K.sess,sess);quiz()});
  on("#check",()=>commit(pending));
  on("#finish",finish);
}
function choose(i){
  const id=sess.ids[sess.idx];
  if(sess.answers[id]!==undefined&&sess.instant)return;
  if(sess.instant){pending=i;quiz()}
  else{ // no instant feedback: record immediately (can change before moving on)
    sess.answers[id]=i;save(K.sess,sess);quiz();
  }
}
function commit(i){
  if(i===null||i===undefined)return;
  const id=sess.ids[sess.idx];
  sess.answers[id]=i;pending=null;save(K.sess,sess);quiz();
}
document.addEventListener("keydown",e=>{
  if(!sess||!$(".qtext"))return;
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  const k=e.key.toUpperCase();const q=qById(sess.ids[sess.idx]);
  if(k.length===1&&LET.includes(k)&&LET.indexOf(k)<q.o.length){choose(LET.indexOf(k))}
  else if(e.key==="Enter"){const b=$("#check")||$("#next")||$("#finish");if(b&&!b.disabled)b.click()}
  else if(e.key==="ArrowLeft"){const b=$("#prev");if(b&&!b.disabled)b.click()}
});

/* ============ RESULTS ============ */
function finish(){
  const unanswered=sess.ids.filter(id=>sess.answers[id]===undefined).length;
  if(unanswered&&!confirm(`${unanswered} question(s) unanswered. They'll be counted as incorrect. Finish anyway?`))return;
  const res=sess.ids.map(id=>{const q=qById(id);const a=sess.answers[id];return{q,a,ok:a===q.a}});
  res.forEach(r=>recordStats(r.q.n,r.ok));
  const correct=res.filter(r=>r.ok).length;
  const hist=load(K.hist,[]);
  hist.unshift({date:Date.now(),label:sess.label,total:res.length,correct});
  save(K.hist,hist.slice(0,30));
  const result={label:sess.label,res,correct};
  sess=null;del(K.sess);
  results(result);
}
function results(r){
  $("#homeBtn").classList.remove("hidden");
  const total=r.res.length;const p=pct(r.correct,total);
  const byCh={};
  r.res.forEach(x=>{const c=byCh[x.q.ch]||(byCh[x.q.ch]={t:0,w:0,missed:[]});c.t++;if(!x.ok){c.w++;c.missed.push(x.q.n)}});
  const rows=Object.entries(byCh).map(([ch,v])=>({ch:+ch,...v,p:pct(v.t-v.w,v.t)})).sort((a,b)=>a.p-b.p||b.w-a.w);
  const need=rows.filter(x=>x.w>0);
  let h=`<div class="card"><p class="muted" style="margin:0">${esc(r.label)}</p>
  <div class="score">${r.correct} / ${total}</div><h2 style="margin-top:6px">${p}%</h2>
  <p class="muted" style="margin-bottom:0">${p>=80?"Strong result. Keep sharpening the weak spots below.":p>=60?"Decent, but there's room to improve.":"More study needed. Focus on the chapters below."}</p></div>`;

  h+=`<div class="card"><h3>Chapters to study</h3>`;
  if(!need.length)h+=`<p>Perfect score. No chapters need extra study.</p>`;
  else{
    h+=`<p class="muted" style="margin-top:0">Ranked by the share of questions you missed in this attempt.</p>`;
    need.forEach(x=>{const lv=level(x.p);
      h+=`<div class="chrow"><div class="top"><span><b>Ch. ${x.ch+1}: ${esc(CHAPTERS[x.ch].name)}</b></span><span class="pill ${lv}">${levelTxt[lv]}</span></div>
      <div class="bar"><i style="width:${x.p}%"></i></div>
      <div class="muted" style="font-size:.88rem;margin-top:4px">${x.t-x.w} of ${x.t} correct (${x.p}%). Missed: ${x.missed.map(n=>"Q"+n).join(", ")}</div></div>`});
  }
  const good=rows.filter(x=>x.w===0);
  if(good.length)h+=`<p class="muted" style="margin-bottom:0">No misses in: ${good.map(x=>"Ch. "+(x.ch+1)).join(", ")}.</p>`;
  h+=`</div>`;

  const wrong=r.res.filter(x=>!x.ok);
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Review missed questions (${wrong.length})</h3></div>`;
  if(!wrong.length)h+=`<p>Nothing to review.</p>`;
  wrong.forEach(x=>{
    h+=`<div class="rev"><div class="muted" style="font-size:.8rem">Q${x.q.n} · Ch. ${x.q.ch+1}: ${esc(CHAPTERS[x.q.ch].name)}</div>
    <div style="font-weight:600;margin:2px 0">${esc(x.q.q)}</div>
    <div class="a" style="color:var(--bad)">Your answer: ${x.a===undefined?"(none)":LET[x.a]+". "+esc(x.q.o[x.a])}</div>
    <div class="a" style="color:var(--ok)">Correct: ${LET[x.q.a]}. ${esc(x.q.o[x.q.a])}</div></div>`;
  });
  h+=`</div><div class="row">`;
  if(wrong.length)h+=`<button class="btn" id="retry">Retry missed questions</button>`;
  h+=`<button class="btn sec" id="again">Back to home</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  const on=(i,f)=>{const e=$(i);if(e)e.onclick=f};
  on("#again",home);
  on("#retry",()=>begin(shuffle(wrong.map(x=>x.q.n)),"Retry: missed questions"));
}

$("#homeBtn").onclick=()=>{
  if(sess&&$(".qtext")){/* progress is already saved; just leave */}
  pending=null;home();
};
home();
</script>
</body>
</html>
